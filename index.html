<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tarjetas de Hoja Completa</title>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Lato:wght@300;400;700;900&family=Montserrat:wght@300;400;700;900&family=Oswald:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-family: 'Arial', sans-serif;
            --font-weight: 400;
        }

        body {
            background-color: #f3f4f6;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
        }

        /* Área de previsualización (fondo gris con las hojas centradas) */
        #print-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px;
        }

        /* Estructura base de CADA hoja */
        .page-preview {
            background: white;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            padding: 15mm; /* Margen interno de la hoja */
            box-sizing: border-box;
            
            /* Para que al imprimir genere un salto de página después de cada hoja */
            page-break-after: always;
            break-after: page;
            
            /* Aplicar fuente dinámica */
            font-family: var(--font-family);
            font-weight: var(--font-weight);
            
            /* Flex para estirar la tarjeta interna */
            display: flex;
        }

        /* Tamaños de papel estándar */
        .page-carta {
            width: 215.9mm;
            height: 279.4mm;
        }

        .page-oficio {
            width: 215.9mm;
            height: 355.6mm;
        }

        /* La Tarjeta que ocupa toda la hoja */
        .card {
            border: 6px solid #1f2937; /* Borde grueso para hacerla destacar */
            border-radius: 16px;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-evenly; /* Distribuye el espacio entre los textos verticalmente */
            align-items: center; /* Centrado horizontal */
            text-align: center;
            padding: 2rem;
            box-sizing: border-box;
        }

        /* Tamaños GIGANTES para aprovechar el espacio */
        .cct-box {
            font-size: 1.8rem;
            background: #e5e7eb;
            padding: 10px 25px;
            border-radius: 12px;
            letter-spacing: 2px;
        }
        
        .nombre-box {
            font-size: 3.5rem;
            line-height: 1.2;
            text-transform: uppercase;
            width: 90%;
        }

        .sede-box {
            font-size: 2.2rem;
            color: #374151;
            width: 90%;
        }

        .fecha-hora-box {
            display: flex;
            flex-direction: column;
            gap: 15px;
            font-size: 2rem;
            border-top: 3px dashed #9ca3af;
            padding-top: 2rem;
            width: 80%;
        }

        @media print {
            body { background: white; }
            aside { display: none !important; }
            main { 
                width: 100% !important; 
                padding: 0 !important; 
                overflow: visible !important;
                display: block !important;
            }
            #print-area {
                gap: 0;
                padding: 0;
                display: block;
            }
            .page-preview {
                box-shadow: none;
                margin: 0;
            }
            /* Ocultar el último salto de página para no sacar una hoja en blanco al final */
            .page-preview:last-child {
                page-break-after: auto;
                break-after: auto;
            }
        }
    </style>
    <style id="dynamic-print-style"></style>
</head>

<body class="h-screen flex overflow-hidden">

    <!-- Panel Lateral: Controles -->
    <aside class="w-1/3 bg-white p-6 shadow-xl z-10 flex flex-col h-full overflow-y-auto border-r border-gray-200">
        <h1 class="text-2xl font-bold text-gray-800 mb-6 flex items-center gap-2">
            📄 Creador de Carteles
        </h1>

        <div class="space-y-4 mb-6">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tamaño de Papel</label>
                <select id="paper-size" class="w-full border border-gray-300 rounded-md p-2 focus:ring-blue-500 focus:border-blue-500">
                    <option value="carta">Carta (8.5" x 11")</option>
                    <option value="oficio">Oficio (8.5" x 14")</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Tipo de Letra</label>
                <select id="font-family" class="w-full border border-gray-300 rounded-md p-2">
                    <optgroup label="Fuentes de Google (Modernas)">
                        <option value="'Montserrat', sans-serif">Montserrat</option>
                        <option value="'Poppins', sans-serif">Poppins</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                        <option value="'Oswald', sans-serif">Oswald (Compacta)</option>
                        <option value="'Lato', sans-serif">Lato</option>
                        <option value="'Playfair Display', serif">Playfair Display (Elegante)</option>
                        <option value="'Dancing Script', cursive">Dancing Script (Cursiva)</option>
                    </optgroup>
                    <optgroup label="Fuentes del Sistema">
                        <option value="'Arial', sans-serif">Arial</option>
                        <option value="'Times New Roman', serif">Times New Roman</option>
                        <option value="'Courier New', monospace">Courier New</option>
                    </optgroup>
                </select>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Grosor de Letra</label>
                <select id="font-weight" class="w-full border border-gray-300 rounded-md p-2">
                    <option value="300">Ligera</option>
                    <option value="400">Normal</option>
                    <option value="700" selected>Negrita</option>
                    <option value="900">Extra Negrita</option>
                </select>
            </div>
        </div>

        <div class="flex-grow flex flex-col">
            <label class="block text-sm font-medium text-gray-700 mb-2">
                📋 Pega aquí los datos desde Excel:
                <br>
                <span class="text-xs text-gray-500 font-normal">Columnas esperadas: CCT | Nombre Escuela | Sede | Fecha | Horario</span>
            </label>
            <textarea id="excel-data" class="w-full flex-grow border border-gray-300 rounded-md p-3 text-sm font-mono whitespace-pre focus:ring-blue-500 focus:border-blue-500" placeholder="Ejemplo:
12DPR1234X	Escuela Benito Juárez	Auditorio Municipal	15/10/2026	08:00 AM
12DPR5678Y	Escuela Lázaro Cárdenas	Salón de Usos Múltiples	16/10/2026	10:00 AM"></textarea>
        </div>

        <div class="mt-6 space-y-3">
            <button onclick="generarTarjetas()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md transition duration-200 shadow-md">
                ⚙️ Generar Tarjetas
            </button>
            <button onclick="imprimirPDF()" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-md transition duration-200 shadow-md">
                💾 Imprimir / PDF
            </button>
        </div>
    </aside>

    <main class="w-2/3 bg-gray-200 overflow-y-auto block">
        <!-- Contenedor general de hojas -->
        <div id="print-area">
            <!-- Mensaje por defecto -->
            <div class="page-preview page-carta flex items-center justify-center text-gray-400 text-xl" id="mensaje-vacio">
                Pega tus datos y presiona "Generar Tarjetas" para ver las hojas aquí.
            </div>
        </div>
    </main>

    <script>
        function actualizarEstilosGenerales() {
            const fontFamily = document.getElementById('font-family').value;
            const fontWeight = document.getElementById('font-weight').value;
            const root = document.documentElement;
            
            root.style.setProperty('--font-family', fontFamily);
            root.style.setProperty('--font-weight', fontWeight);
        }

        function actualizarTamanoPapel() {
            const paperSize = document.getElementById('paper-size').value;
            const stylePrint = document.getElementById('dynamic-print-style');
            
            // Actualizar hojas que ya estén generadas
            const hojas = document.querySelectorAll('.page-preview');
            hojas.forEach(hoja => {
                hoja.className = `page-preview page-${paperSize}`;
            });

            // Actualizar regla CSS @page para que la impresora tome el tamaño de papel
            if (paperSize === 'carta') {
                stylePrint.innerHTML = `@page { size: letter; margin: 0; }`;
            } else {
                stylePrint.innerHTML = `@page { size: legal; margin: 0; }`;
            }
        }

        function generarTarjetas() {
            actualizarEstilosGenerales();
            const paperSize = document.getElementById('paper-size').value;
            const textarea = document.getElementById('excel-data').value;
            const printArea = document.getElementById('print-area');
            
            printArea.innerHTML = ''; // Limpiar área

            if (!textarea.trim()) {
                printArea.innerHTML = `
                    <div class="page-preview page-${paperSize} flex items-center justify-center text-red-500 text-xl text-center px-10">
                        No hay datos para procesar. Pega información de Excel primero.
                    </div>`;
                return;
            }

            const filas = textarea.split('\n');
            let tarjetasGeneradas = 0;

            filas.forEach((fila) => {
                if (fila.trim() === '') return; 

                const columnas = fila.split('\t');
                
                const cct = columnas[0] ? columnas[0].trim() : '-';
                const nombre = columnas[1] ? columnas[1].trim() : '-';
                const sede = columnas[2] ? columnas[2].trim() : '-';
                const fecha = columnas[3] ? columnas[3].trim() : '-';
                const horario = columnas[4] ? columnas[4].trim() : '-';

                // Crear un DIV por cada hoja (página de impresión)
                const hoja = document.createElement('div');
                hoja.className = `page-preview page-${paperSize}`;

                hoja.innerHTML = `
                    <div class="card">
                        <div class="cct-box">CCT: <strong>${cct}</strong></div>
                        <div class="nombre-box" style="font-weight: var(--font-weight);">${nombre}</div>
                        <div class="sede-box">Sede:<br><strong>${sede}</strong></div>
                        
                        <div class="fecha-hora-box">
                            <div>📅 Fecha: <strong>${fecha}</strong></div>
                            <div>⏰ Hora: <strong>${horario}</strong></div>
                        </div>
                    </div>
                `;

                printArea.appendChild(hoja);
                tarjetasGeneradas++;
            });

            if (tarjetasGeneradas === 0) {
                printArea.innerHTML = `
                    <div class="page-preview page-${paperSize} flex items-center justify-center text-red-500 text-xl text-center px-10">
                        Formato no válido. Asegúrate de copiar las celdas directamente desde Excel (separadas por tabulación).
                    </div>`;
            }
            
            actualizarTamanoPapel();
        }

        // Listeners para reflejar cambios en tiempo real sin volver a procesar el texto (si ya existen las tarjetas)
        document.getElementById('paper-size').addEventListener('change', actualizarTamanoPapel);
        document.getElementById('font-family').addEventListener('change', actualizarEstilosGenerales);
        document.getElementById('font-weight').addEventListener('change', actualizarEstilosGenerales);

        actualizarTamanoPapel();

        function imprimirPDF() {
            actualizarEstilosGenerales();
            window.print();
        }
    </script>
</body>
</html>
