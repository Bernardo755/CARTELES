<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tarjetas Flashcards</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400..700&family=Lato:wght@300;400;700;900&family=Montserrat:wght@300;400;700;900&family=Oswald:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-family: 'Montserrat', sans-serif;
            --font-weight: 700;
            --grid-cols: 1;
            --grid-rows: 1;
        }

        body {
            background-color: #e5e7eb;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #print-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            padding: 40px;
        }

        .page-preview {
            background: white;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
            font-family: var(--font-family);
            font-weight: var(--font-weight);
            padding: 10mm;
            display: grid;
            gap: 15px; 
            grid-template-columns: repeat(var(--grid-cols), 1fr);
            grid-template-rows: repeat(var(--grid-rows), 1fr);
        }

        .valor-box {
            position: relative;
            border: 3px dashed #9ca3af;
            border-radius: 8px;
            background-color: #ffffff;
            width: 100%;
            height: 100%;
            min-width: 50px;
            min-height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            resize: both;
            overflow: hidden;
            box-sizing: border-box;
            padding: 10px;
            transition: border-color 0.2s, box-shadow 0.2s;
            cursor: pointer; /* Indica que se puede seleccionar */
        }

        .valor-box:hover {
            border-color: #3b82f6;
            box-shadow: inset 0 0 0 1px #3b82f6;
            z-index: 10;
        }

        /* Estilo para las cajas seleccionadas manualmente */
        .valor-box.selected {
            border-color: #f59e0b; /* Naranja/Dorado */
            border-style: solid;
            box-shadow: inset 0 0 0 2px #f59e0b, 0 0 10px rgba(245, 158, 11, 0.4);
            z-index: 15;
        }

        .fit-text {
            white-space: pre-wrap;
            word-break: break-word;
            line-height: 0.95;
            margin: 0;
            padding: 0;
            display: inline-block;
            text-align: center;
            pointer-events: none;
        }

        .valor-box::after {
            content: '◢';
            position: absolute;
            bottom: 2px;
            right: 2px;
            font-size: 12px;
            color: #9ca3af;
            pointer-events: none;
            opacity: 0.7;
        }
        
        .valor-box:hover::after { color: #3b82f6; opacity: 1; }
        .valor-box.selected::after { color: #f59e0b; opacity: 1; }

        .hover-toolbar {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            gap: 5px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.2s;
            background: rgba(255,255,255,0.95);
            padding: 4px;
            border-radius: 6px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .valor-box:hover .hover-toolbar, .valor-box.selected .hover-toolbar {
            opacity: 1;
            visibility: visible;
        }

        .toolbar-btn {
            background: #f3f4f6;
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 2px 6px;
            font-size: 12px;
            cursor: pointer;
            color: #374151;
            transition: background 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
        }

        .toolbar-btn:hover {
            background: #e5e7eb;
            color: #000;
        }

        .col-span-full { grid-column: 1 / -1 !important; }
        .row-span-full { grid-row: 1 / -1 !important; }

        @media print {
            body { background: white; }
            aside { display: none !important; }
            main { width: 100% !important; padding: 0 !important; overflow: visible !important; display: block !important; }
            #print-area { gap: 0; padding: 0; display: block; }
            .page-preview { box-shadow: none; margin: 0; border: none; }
            .page-preview:last-child { page-break-after: auto; break-after: auto; }
            .valor-box { border: 2px solid #000 !important; resize: none; box-shadow: none !important; }
            .valor-box::after { display: none !important; }
            .hover-toolbar { display: none !important; }
        }
    </style>
    
    <style id="dynamic-print-style"></style>
</head>

<body class="h-screen flex overflow-hidden">

    <aside class="w-80 bg-white p-6 shadow-2xl z-10 flex flex-col h-full overflow-y-auto border-r border-gray-200 shrink-0">
        <h1 class="text-xl font-black text-gray-900 mb-6 flex items-center gap-2 uppercase tracking-tighter leading-tight border-b pb-4">
            Flashcards<br><span class="text-blue-600 text-lg">Generator</span>
        </h1>

        <!-- NUEVA SECCIÓN: Controles Manuales de Letra -->
        <div class="mb-5 p-3 bg-gray-50 border border-gray-200 rounded-lg shadow-sm">
            <label class="block font-bold text-gray-800 mb-1">🔠 Ajuste Manual de Letra</label>
            <p class="text-xs text-gray-500 mb-3 leading-tight">Clic en las cajas para seleccionar. Si no seleccionas ninguna, aplicará a todas.</p>
            <div class="flex gap-2">
                <button onclick="adjustFontSize(0.85)" class="flex-1 bg-white hover:bg-gray-100 text-gray-800 font-bold py-2 rounded shadow-sm border border-gray-300 transition">A-</button>
                <button onclick="adjustFontSize(1.15)" class="flex-1 bg-white hover:bg-gray-100 text-gray-800 font-bold py-2 rounded shadow-sm border border-gray-300 transition">A+</button>
                <button onclick="restoreAutoSize()" class="flex-1 bg-blue-100 hover:bg-blue-200 text-blue-800 font-bold py-2 rounded shadow-sm border border-blue-300 transition">Auto</button>
            </div>
        </div>

        <div class="space-y-4 mb-4 text-sm">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Valores por fila (Cajas/Hoja)</label>
                <input type="number" id="values-per-row" min="1" max="20" value="4" class="w-full border border-gray-300 rounded-md p-2 bg-gray-50 focus:border-blue-600 outline-none font-bold text-center">
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Tamaño de Papel</label>
                <select id="paper-size" class="w-full border border-gray-300 rounded-md p-2 bg-gray-50 focus:border-blue-600 outline-none">
                    <option value="carta">Carta (8.5" x 11")</option>
                    <option value="oficio">Legal / Oficio (8.5" x 14")</option>
                    <option value="a4">A4 (210 x 297 mm)</option>
                    <option value="tabloide">Tabloide (11" x 17")</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Orientación</label>
                <select id="orientation" class="w-full border border-gray-300 rounded-md p-2 bg-gray-50 focus:border-blue-600 outline-none">
                    <option value="landscape">Horizontal (Landscape)</option>
                    <option value="portrait">Vertical (Portrait)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Tipo de Letra</label>
                <select id="font-family" class="w-full border border-gray-300 rounded-md p-2 bg-gray-50 focus:border-blue-600 outline-none">
                    <option value="'Montserrat', sans-serif" selected>Montserrat</option>
                    <option value="'Poppins', sans-serif">Poppins</option>
                    <option value="'Roboto', sans-serif">Roboto</option>
                    <option value="'Oswald', sans-serif">Oswald</option>
                    <option value="'Lato', sans-serif">Lato</option>
                    <option value="'Playfair Display', serif">Playfair Display</option>
                    <option value="'Dancing Script', cursive">Dancing Script</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Grosor de Letra</label>
                <select id="font-weight" class="w-full border border-gray-300 rounded-md p-2 bg-gray-50 focus:border-blue-600 outline-none">
                    <option value="400">Normal</option>
                    <option value="700" selected>Negrita (Bold)</option>
                    <option value="900">Extra Negrita</option>
                </select>
            </div>
        </div>

        <div class="flex-grow flex flex-col mb-4 min-h-[150px]">
            <label class="block font-bold text-gray-700 mb-1 text-sm">
                📋 Pega aquí los datos (Excel TSV):
            </label>
            <textarea id="excel-data" class="w-full flex-grow border border-gray-300 rounded-md p-3 text-xs font-mono whitespace-pre focus:border-blue-600 outline-none resize-none" placeholder="Pega las filas desde Excel aquí...&#10;Dato1&#9;Dato2&#9;Dato3&#9;Dato4&#10;Valor1&#9;Valor2&#9;Valor3&#9;Valor4"></textarea>
        </div>

        <div class="space-y-3">
            <button onclick="procesarDatos()" class="w-full bg-gray-900 hover:bg-gray-800 text-white font-bold py-3 px-4 rounded-md uppercase tracking-wider transition shadow-lg">
                ⚡ Generar Tarjetas
            </button>
            <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-md uppercase tracking-wider transition shadow-lg">
                🖨️ Imprimir / PDF
            </button>
        </div>
    </aside>

    <main class="flex-grow overflow-y-auto block relative" id="main-scroll">
        <div id="print-area">
            <div class="page-preview flex items-center justify-center bg-transparent shadow-none w-full h-full text-gray-400 font-bold text-2xl text-center" style="grid-template-columns: 1fr; grid-template-rows: 1fr;">
                <div class="opacity-70">
                    <span class="text-4xl block mb-4">📄</span>
                    Pega tus datos y presiona<br><span class="text-gray-800">"GENERAR TARJETAS"</span>
                </div>
            </div>
        </div>
    </main>

    <script>
        const paperDimensions = {
            carta: { w: 21.59, h: 27.94, print: 'letter' },
            oficio: { w: 21.59, h: 35.56, print: 'legal' },
            a4: { w: 21.00, h: 29.70, print: 'A4' },
            tabloide: { w: 27.94, h: 43.18, print: 'ledger' }
        };

        function getOptimalGrid(numItems, orientation) {
            let cols = Math.ceil(Math.sqrt(numItems));
            let rows = Math.ceil(numItems / cols);

            if (orientation === 'landscape' && rows > cols) {
                [cols, rows] = [rows, cols]; 
            } else if (orientation === 'portrait' && cols > rows) {
                [cols, rows] = [rows, cols]; 
            }
            
            if (cols * rows < numItems) rows = Math.ceil(numItems / cols);
            return { cols, rows };
        }

        function actualizarEstilos() {
            const fontFamily = document.getElementById('font-family').value;
            const fontWeight = document.getElementById('font-weight').value;
            const paperType = document.getElementById('paper-size').value;
            const orientation = document.getElementById('orientation').value;
            const root = document.documentElement;
            
            root.style.setProperty('--font-family', fontFamily);
            root.style.setProperty('--font-weight', fontWeight);

            let widthCm = paperDimensions[paperType].w;
            let heightCm = paperDimensions[paperType].h;

            if (orientation === 'landscape') {
                [widthCm, heightCm] = [heightCm, widthCm];
            }

            const stylePrint = document.getElementById('dynamic-print-style');
            const printSize = paperDimensions[paperType].print;
            
            stylePrint.innerHTML = `
                .page-preview { width: ${widthCm}cm; height: ${heightCm}cm; }
                @page { size: ${printSize} ${orientation}; margin: 0; }
            `;
        }

        function fitText(box) {
            // SI TIENE TAMAÑO MANUAL, IGNORAR AUTO-AJUSTE
            if (box.dataset.manualSize === "true") return;

            const textEl = box.querySelector('.fit-text');
            if (!textEl || !textEl.innerText.trim()) return;

            let min = 5;
            let max = 800;
            let optimal = min;

            textEl.style.fontSize = min + 'px';
            const safePadding = 24; 

            while (min <= max) {
                const mid = Math.floor((min + max) / 2);
                textEl.style.fontSize = mid + 'px';

                const textWidth = textEl.scrollWidth;
                const textHeight = textEl.scrollHeight;
                
                const containerWidth = box.clientWidth - safePadding;
                const containerHeight = box.clientHeight - safePadding;

                if (textWidth <= containerWidth && textHeight <= containerHeight) {
                    optimal = mid; 
                    min = mid + 1; 
                } else {
                    max = mid - 1; 
                }
            }

            textEl.style.fontSize = optimal + 'px';
        }

        const resizeTimeouts = new WeakMap();

        const boxObserver = new ResizeObserver(entries => {
            for (let entry of entries) {
                const box = entry.target;
                if (resizeTimeouts.has(box)) {
                    clearTimeout(resizeTimeouts.get(box));
                }
                resizeTimeouts.set(box, setTimeout(() => {
                    fitText(box);
                }, 50)); 
            }
        });

        function setMaxWidth(btn) {
            const box = btn.closest('.valor-box');
            box.classList.toggle('col-span-full');
            box.style.width = '';
            fitText(box);
        }

        function setMaxHeight(btn) {
            const box = btn.closest('.valor-box');
            box.classList.toggle('row-span-full');
            box.style.height = '';
            fitText(box);
        }

        function resetBoxSize(btn) {
            const box = btn.closest('.valor-box');
            box.classList.remove('col-span-full', 'row-span-full');
            box.style.width = '';
            box.style.height = '';
            fitText(box);
        }

        function adjustFontSize(factor) {
            // Buscar seleccionadas, si no hay, tomar todas
            let targets = document.querySelectorAll('.valor-box.selected');
            if (targets.length === 0) {
                targets = document.querySelectorAll('.valor-box');
            }
            
            if (targets.length === 0) return;

            targets.forEach(box => {
                const textEl = box.querySelector('.fit-text');
                if (!textEl) return;
                
                // Marcar como manual para que el ResizeObserver no lo sobreescriba
                box.dataset.manualSize = "true"; 
                
                // Obtener tamaño actual y calcular el nuevo
                let currentSize = parseFloat(window.getComputedStyle(textEl).fontSize);
                let newSize = Math.max(5, currentSize * factor); 
                textEl.style.fontSize = newSize + 'px';
            });
        }

        function restoreAutoSize() {
            let targets = document.querySelectorAll('.valor-box.selected');
            if (targets.length === 0) {
                targets = document.querySelectorAll('.valor-box');
            }
            
            targets.forEach(box => {
                // Eliminar el flag manual
                delete box.dataset.manualSize;
                // Forzar re-cálculo
                fitText(box); 
            });
        }

        function procesarDatos() {
            actualizarEstilos();
            
            const textarea = document.getElementById('excel-data').value;
            const printArea = document.getElementById('print-area');
            let numValues = parseInt(document.getElementById('values-per-row').value, 10);
            const orientation = document.getElementById('orientation').value;

            if (isNaN(numValues) || numValues < 1) numValues = 1;
            if (numValues > 20) numValues = 20;
            document.getElementById('values-per-row').value = numValues;

            printArea.innerHTML = '';

            if (!textarea.trim()) {
                printArea.innerHTML = `<div class="p-10 text-red-500 font-bold">Por favor pega datos de Excel.</div>`;
                return;
            }

            const gridSetup = getOptimalGrid(numValues, orientation);
            document.documentElement.style.setProperty('--grid-cols', gridSetup.cols);
            document.documentElement.style.setProperty('--grid-rows', gridSetup.rows);

            boxObserver.disconnect();

            const filas = textarea.split('\n');

            filas.forEach((fila) => {
                if (fila.trim() === '') return;

                const columnas = fila.split('\t');
                const hoja = document.createElement('div');
                hoja.className = 'page-preview';

                for (let i = 0; i < numValues; i++) {
                    const textContent = columnas[i] ? columnas[i].trim() : '';
                    
                    const container = document.createElement('div');
                    container.className = 'valor-box';
                    
                    // Al hacer clic en la caja se selecciona
                    container.addEventListener('click', function(e) {
                        // Evitar que seleccione la caja si dimos clic en los botones del toolbar
                        if (e.target.closest('.hover-toolbar')) return;
                        this.classList.toggle('selected');
                    });
                    
                    const toolbarHTML = `
                        <div class="hover-toolbar">
                            <button class="toolbar-btn" onclick="setMaxWidth(this)" title="Maximizar Ancho">↔️</button>
                            <button class="toolbar-btn" onclick="setMaxHeight(this)" title="Maximizar Alto">↕️</button>
                            <button class="toolbar-btn" onclick="resetBoxSize(this)" title="Restablecer Tamaño">🔄</button>
                        </div>
                    `;
                    container.innerHTML = toolbarHTML;

                    const span = document.createElement('span');
                    span.className = 'fit-text';
                    span.innerText = textContent;
                    
                    container.appendChild(span);
                    hoja.appendChild(container);

boxObserver.observe(container);
                }

                printArea.appendChild(hoja);
            });
        }

        actualizarEstilos();
    </script>
</body>
</html>
