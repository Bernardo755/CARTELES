<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador de Tarjetas - Tamaño Máximo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bebas+Neue&family=Dancing+Script:wght@400..700&family=Lato:wght@300;400;700;900&family=Montserrat:wght@300;400;700;900&family=Oswald:wght@300;400;700&family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Poppins:wght@300;400;700;900&family=Roboto:wght@300;400;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --font-family: 'Montserrat', sans-serif;
            --font-weight: 900;
        }

        body {
            background-color: #f3f4f6;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Área de previsualización */
        #print-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        /* Estructura base de la hoja */
        .page-preview {
            background: white;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
            font-family: var(--font-family);
            font-weight: var(--font-weight);
            display: flex;
            padding: 10mm; /* Margen mínimo para que la impresora no corte los bordes */
            overflow: hidden;
        }

        /* Tamaños de papel exactos en centímetros */
        .page-carta {
            width: 21.59cm;
            height: 27.94cm;
        }

        .page-oficio {
            width: 21.59cm;
            height: 35.56cm;
        }

        /* Tarjeta interior para el borde y estructura */
        .card {
            border: 8px solid #000;
            border-radius: 12px;
            width: 100%;
            height: 100%;
            box-sizing: border-box;
            display: grid;
            gap: 10px;
            padding: 10px;
        }

        /* LAYOUT 1: Estándar Apilado (Todo horizontal) */
        .layout-stacked {
            grid-template-rows: 15% 40% 30% 15%;
            grid-template-columns: 1fr;
        }

        /* LAYOUT 2: Rotado Máximo (Fecha y hora a un lado) */
        .layout-rotated {
            grid-template-rows: 15% 55% 30%;
            grid-template-columns: 1fr 15%; /* 15% para el panel lateral */
        }
        .layout-rotated .cct-container { grid-column: 1 / 3; }
        .layout-rotated .nombre-container { grid-column: 1 / 2; grid-row: 2 / 3; }
        .layout-rotated .sede-container { grid-column: 1 / 2; grid-row: 3 / 4; }
        .layout-rotated .fecha-hora-container { 
            grid-column: 2 / 3; 
            grid-row: 2 / 4; 
            display: flex;
            justify-content: center;
            align-items: center;
            border-top: none;
            border-left: 5px solid #000;
            padding-left: 10px;
        }

        .fit-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            text-align: center;
        }

        .fit-container.vertical-text {
            writing-mode: vertical-rl;
            transform: rotate(180deg); /* Para que se lea de abajo hacia arriba */
            text-align: center;
        }

        /* El span interior que se medirá matemáticamente */
        .fit-text {
            white-space: pre-wrap; /* Permite saltos de línea donde haya espacios */
            line-height: 0.95; /* Muy pegado para ahorrar espacio vertical */
            word-break: break-word; /* Evita que palabras súper largas rompan el layout */
            margin: 0;
            padding: 0;
            display: inline-block;
        }
        
        .no-wrap {
            white-space: nowrap !important;
        }

        /* Estética base */
        .cct-container { border-bottom: 5px solid #000; }
        .fecha-hora-container { border-top: 5px solid #000; }
        
        .layout-rotated .fecha-hora-container { border-top: none; }

        @media print {
            body { background: white; }
            aside { display: none !important; }
            main { 
                width: 100% !important; 
                padding: 0 !important; 
                overflow: visible !important;
                display: block !important;
            }
            #print-area { gap: 0; padding: 0; display: block; }
            .page-preview { box-shadow: none; margin: 0; border: none; }
            .page-preview:last-child { page-break-after: auto; break-after: auto; }
        }
    </style>
    <style id="dynamic-print-style">
        @page { size: letter; margin: 0; }
    </style>
</head>

<body class="h-screen flex overflow-hidden">

    <aside class="w-80 bg-white p-5 shadow-2xl z-10 flex flex-col h-full overflow-y-auto border-r border-gray-200 shrink-0">
        <h1 class="text-xl font-black text-gray-900 mb-4 flex items-center gap-2 uppercase tracking-tighter">
            MAX FORMATTER 📄
        </h1>

        <div class="space-y-4 mb-4 text-sm">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Diseño / Layout</label>
                <select id="layout-type" class="w-full border-2 border-gray-900 rounded-md p-2 font-bold bg-gray-50">
                    <option value="layout-rotated">💥 Panel Rotado (Maximiza Espacio)</option>
                    <option value="layout-stacked">☰ Apilado Estándar</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Tamaño de Papel</label>
                <select id="paper-size" class="w-full border border-gray-300 rounded-md p-2">
                    <option value="carta">Carta (21.59 x 27.94 cm)</option>
                    <option value="oficio">Oficio (21.59 x 35.56 cm)</option>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Tipo de Letra (Impacto)</label>
                <select id="font-family" class="w-full border border-gray-300 rounded-md p-2">
                    <optgroup label="Extremas (Recomendadas)">
                        <option value="'Anton', sans-serif">Anton (Ultra Condensada)</option>
                        <option value="'Bebas Neue', sans-serif">Bebas Neue (Alta)</option>
                        <option value="'Oswald', sans-serif">Oswald</option>
                    </optgroup>
                    <optgroup label="Modernas">
                        <option value="'Montserrat', sans-serif" selected>Montserrat</option>
                        <option value="'Poppins', sans-serif">Poppins</option>
                        <option value="'Roboto', sans-serif">Roboto</option>
                    </optgroup>
                    <optgroup label="Clásicas">
                        <option value="'Arial', sans-serif">Arial</option>
                    </optgroup>
                </select>
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Grosor de Letra</label>
                <select id="font-weight" class="w-full border border-gray-300 rounded-md p-2">
                    <option value="400">Normal</option>
                    <option value="700">Negrita (Bold)</option>
                    <option value="900" selected>Extra Negrita (Black)</option>
                </select>
            </div>
        </div>

        <div class="flex-grow flex flex-col mb-4">
            <label class="block font-bold text-gray-700 mb-1 text-sm">
                📋 Datos de Excel (CCT | Escuela | Sede | Fecha | Hora)
            </label>
            <textarea id="excel-data" class="w-full flex-grow border-2 border-gray-300 rounded-md p-2 text-xs font-mono whitespace-pre focus:border-black resize-none" placeholder="12DPR1234X	Escuela Benito Juárez	Auditorio Municipal	15/10/2026	08:00 AM"></textarea>
        </div>

        <div class="space-y-2">
            <button onclick="procesarDatos()" class="w-full bg-black hover:bg-gray-800 text-white font-black py-3 px-4 rounded-md uppercase tracking-widest transition">
                ⚡ Generar Hojas
            </button>
            <button onclick="window.print()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-black py-3 px-4 rounded-md uppercase tracking-widest transition">
                🖨️ Imprimir / PDF
            </button>
        </div>
    </aside>

    <main class="flex-grow bg-gray-300 overflow-y-auto block" id="main-scroll">
        <div id="print-area">
            <div class="page-preview page-carta flex items-center justify-center text-gray-500 font-bold text-2xl text-center">
                Pega tus datos y presiona<br>"GENERAR HOJAS"
            </div>
        </div>
    </main>

    <script>
        // Actualizar variables CSS
        function actualizarEstilos() {
            const fontFamily = document.getElementById('font-family').value;
            const fontWeight = document.getElementById('font-weight').value;
            document.documentElement.style.setProperty('--font-family', fontFamily);
            document.documentElement.style.setProperty('--font-weight', fontWeight);
        }

        // Actualizar tamaño de papel en CSS para impresión
        function actualizarReglaImpresion(paperSize) {
            const stylePrint = document.getElementById('dynamic-print-style');
            if (paperSize === 'carta') {
                stylePrint.innerHTML = `@page { size: letter; margin: 0; }`;
            } else {
                stylePrint.innerHTML = `@page { size: legal; margin: 0; }`;
            }
        }

        // Función principal
        function procesarDatos() {
            actualizarEstilos();
            const textarea = document.getElementById('excel-data').value;
            const printArea = document.getElementById('print-area');
            const paperSize = document.getElementById('paper-size').value;
            const layoutType = document.getElementById('layout-type').value;

            actualizarReglaImpresion(paperSize);
            printArea.innerHTML = '';

            if (!textarea.trim()) {
                printArea.innerHTML = `<div class="page-preview page-${paperSize} flex items-center justify-center text-red-500 text-2xl font-bold text-center">Sin datos.</div>`;
                return;
            }

            const filas = textarea.split('\n');
            let generadas = 0;

            filas.forEach((fila) => {
                if (fila.trim() === '') return;

                const columnas = fila.split('\t');
                const cct = columnas[0] ? columnas[0].trim() : '';
                const nombre = columnas[1] ? columnas[1].trim() : '';
                const sede = columnas[2] ? columnas[2].trim() : '';
                const fecha = columnas[3] ? columnas[3].trim() : '';
                const hora = columnas[4] ? columnas[4].trim() : '';

                // Crear contenedor de la hoja
                const hoja = document.createElement('div');
                hoja.className = `page-preview page-${paperSize}`;

                // Configuración de visualización basada en el Layout elegido
                const isRotated = layoutType === 'layout-rotated';
                const fechaHoraClass = isRotated ? 'fit-container vertical-text fecha-hora-container' : 'fit-container fecha-hora-container';
                const separadorFH = isRotated ? '  |  ' : ' - '; // Separador entre fecha y hora

                hoja.innerHTML = `
                    <div class="card ${layoutType}">
                        <div class="fit-container cct-container">
                            <span class="fit-text no-wrap">CCT: ${cct}</span>
                        </div>
                        
                        <div class="fit-container nombre-container">
                            <span class="fit-text uppercase">${nombre}</span>
                        </div>
                        
                        <div class="fit-container sede-container">
                            <span class="fit-text uppercase">${sede}</span>
                        </div>
                        
                        <div class="${fechaHoraClass}">
                            <span class="fit-text no-wrap">${fecha}${separadorFH}${hora}</span>
                        </div>
                    </div>
                `;

                printArea.appendChild(hoja);
                generadas++;
            });

            if (generadas > 0) {
                // Una vez renderizado el DOM, aplicamos el algoritmo matemático de ajuste
                // Se usa setTimeout para asegurar que el navegador ya dibujó los contenedores
                setTimeout(autoFitAllText, 50); 
            }
        }

        function autoFitAllText() {
            const containers = document.querySelectorAll('.fit-container');
            
            containers.forEach(container => {
                const textElement = container.querySelector('.fit-text');
                if (!textElement) return;

                // Definir los límites de tamaño en píxeles (de 10px a 1000px)
                let min = 10;
                let max = 1000;
                let optimal = min;

                // Restablecer el tamaño inicial para poder medir
                textElement.style.fontSize = min + 'px';

                // Búsqueda Binaria
                while (min <= max) {
                    const mid = Math.floor((min + max) / 2);
                    textElement.style.fontSize = mid + 'px';

                    // Obtener dimensiones. Si el contenedor está rotado, la lógica de comprobación sigue 
                    // siendo validada contra el clientWidth/Height del contenedor padre.
                    const textWidth = textElement.scrollWidth;
                    const textHeight = textElement.scrollHeight;
                    
                    const containerWidth = container.clientWidth;
                    const containerHeight = container.clientHeight;

                    // Dar un pequeño margen de 4 píxeles para evitar roces exactos con los bordes
                    if (textWidth <= (containerWidth - 4) && textHeight <= (containerHeight - 4)) {
                        optimal = mid; // Este tamaño cabe, intentemos uno más grande
                        min = mid + 1;
                    } else {
                        max = mid - 1; // Este tamaño se desborda, intentemos uno más pequeño
                    }
                }

                // Aplicar el tamaño óptimo encontrado
                textElement.style.fontSize = optimal + 'px';
            });
        }

        // Recalcular tamaños si el usuario cambia el layout, papel o fuentes directamente
        document.getElementById('layout-type').addEventListener('change', procesarDatos);
        document.getElementById('paper-size').addEventListener('change', procesarDatos);
        document.getElementById('font-family').addEventListener('change', procesarDatos);
        document.getElementById('font-weight').addEventListener('change', procesarDatos);

        // Recalcular al redimensionar la ventana (ya que la vista previa usa medidas relativas al zoom del navegador)
        window.addEventListener('resize', () => {
            if (document.querySelectorAll('.fit-container').length > 0) {
                autoFitAllText();
            }
        });
    </script>
</body>
</html>
